name: 持续集成

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
        shell: pwsh

      - name: 代码检查、测试与打包
        run: pwsh -File scripts/run-ci.ps1 ci

      - name: 产物摘要
        if: success()
        run: |
          Get-ChildItem -Path dist -Recurse -File |
            Select-Object FullName, Length |
            Sort-Object Length -Descending |
            Select-Object -First 10
          $exe = Get-ChildItem -Path dist -Recurse -Filter *.exe | Select-Object -First 1
          if ($exe) { Get-FileHash $exe.FullName -Algorithm SHA256 }
        shell: pwsh

      - name: 上传打包产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: olfactorypilot-dist
          path: dist/**/*
